name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint the agents, commands, skills, and manifests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 -I scripts/lint.py --base "origin/$BASE_REF"
          else
            python3 -I scripts/lint.py
          fi

      - name: Test the lint rules
        run: python3 -I scripts/tests/test_lint.py

      - name: Test the outward-writing checker
        run: bash skills/outward-writing/tests/run.sh

  validate:
    name: Validate the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate . --strict
